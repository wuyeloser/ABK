name: Redmi Note 12 Turbo - A17 - KSU Official 5.10.256

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-marble-evox-a17:
    name: marble-evox-a17-5.10.256-android12-9-official-susfs
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android12
      kernel_version: "5.10"
      sub_level: "256"
      os_patch_level: "2026-07"
      revision: "r1"
      kernel_source_ref: a724b19517054466fee056fa48f589423d5bd306
      susfs_source_ref: 3c14ad549f826b1f53878ec8c12253efebeed75a

      ksu_variant: Official
      ksu_branch: Custom(自定义)
      custom_ref: e6832ed548ada2fa16fcbd6c8e98bbd1868f4401
      # Keep the upstream GKI release string intact. Vendor modules on marble
      # expect the android12-9 KMI generation marker.
      version: ""
      build_time: "N"

      enable_susfs: true
      use_zram: false
      zram_full_algo: false
      zram_extra_algos: ""

      use_bbg: false
      use_ddk: false
      use_ntsync: false
      use_networking: false
      use_kpm: false
      use_rekernel: false
      supp_op: false
      virtualization_support: "off"
      upload_aux_artifacts: true
