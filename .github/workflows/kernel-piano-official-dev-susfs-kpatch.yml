name: piano 6.6.118 - Official KernelSU dev + SUSFS + KPatch-Next ready

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # /proc/version and CONFIG_LOCALVERSION confirm android15-8;
      # the live uname value is spoofed by the installed hiding modules.
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: "118"
      os_patch_level: "2026-01"
      ksu_variant: "Official"
      ksu_branch: "Custom(自定义)"
      custom_ref: "28db74f6f4692e97006ce9ebd8b19b9cc614b5b7"
      # Retain the SUSFS revision verified in the previous piano build.
      susfs_ref: "a0f9c59e2243f8a5db955f4ad1686d5e0ad26e1a"
      version: "6.6.118-android15-8"
      build_time: "N"
      enable_susfs: true
      use_zram: false
      use_bbg: false
      use_ddk: false
      use_ntsync: false
      use_networking: false
      # Official KernelSU uses standalone KPatch-Next for KPM;
      # its patcher requires KALLSYMS_ALL and no built-in CONFIG_KPM.
      use_kpm: false
      use_rekernel: false
      supp_op: false
      virtualization_support: "off"
      zram_full_algo: false
      zram_extra_algos: ""
      kpm_password: ""
      custom_external_modules: ""
      custom_kernel_options: |
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
      upload_aux_artifacts: true
