name: popsicle OS4 6.12.69 - Official KernelSU dev + SUSFS

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # OS4.0.4.0/OS4.0.5.0 public device reports; no live device inspection.
      # AOSP android16-6.12-2026-03 confirms SUBLEVEL=69 and KMI_GENERATION=6.
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: "69"
      os_patch_level: "2026-03"
      ksu_variant: "Official"
      ksu_branch: "Custom(自定义)"
      custom_ref: "02ffbd447eb6a2f05d9f46e17b1e1c3bcfdd9971"
      susfs_ref: "395a8c0c88d348e9fe7c14f66a456fde4653287c"
      version: "6.12.69-android16-6-4k"
      build_time: "N"
      enable_susfs: true
      use_zram: false
      use_bbg: false
      use_ddk: false
      use_ntsync: false
      use_networking: false
      use_kpm: false
      use_rekernel: false
      supp_op: false
      virtualization_support: "off"
      zram_full_algo: false
      zram_extra_algos: ""
      kpm_password: ""
      custom_external_modules: ""
      upload_aux_artifacts: true
