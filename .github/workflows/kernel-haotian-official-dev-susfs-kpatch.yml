name: haotian 6.6.118 - Official KernelSU dev + SUSFS + KPatch-Next ready

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # HyperOS 4 / Android 17 on haotian still ships the Android 15 GKI ABI.
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: "118"
      os_patch_level: "2026-01"
      ksu_variant: "Official"
      ksu_branch: "Custom(自定义)"
      # tiann/KernelSU main as of 2026-11-10.
      custom_ref: "02ffbd447eb6a2f05d9f46e17b1e1c3bcfdd9971"
      # susfs4ksu gki-android15-6.6 as of 2026-11-09 (v2.4.0, synced with upstream KSU).
      susfs_ref: "ec03d0c73b821afa1d5037d6d493216f59744fcb"
      version: "6.6.118-android15-8"
      build_time: "N"
      enable_susfs: true
      use_zram: false
      use_bbg: false
      use_ddk: false
      use_ntsync: false
      use_networking: false
      # KPatch-Next supplies KPM on top of Official KernelSU; its own patcher
      # requires KALLSYMS_ALL and expects built-in CONFIG_KPM to remain off.
      use_kpm: false
      use_rekernel: false
      supp_op: false
      virtualization_support: "off"
      zram_full_algo: false
      zram_extra_algos: ""
      kpm_password: ""
      custom_external_modules: ""
      custom_kernel_options: |
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
      upload_aux_artifacts: true
